<form action="https://formsubmit.co/lightisreal9@gmail.com" method="POST" style="font-family: inherit;">
    
    <!-- Optional: Subject line for your inbox -->
    <input type="hidden" name="_subject" value="New guestbook note!">
    
    <div style="margin-bottom: 10px;">
        <label style="display: block; font-weight: bold; font-size: 13px; color: #3a506b; margin-bottom: 3px;">Name:</label>
        <input type="text" name="name" required style="width: 100%; padding: 6px; border: 1px solid #ccc; font-family: inherit; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 10px;">
        <label style="display: block; font-weight: bold; font-size: 13px; color: #3a506b; margin-bottom: 3px;">Message:</label>
        <textarea name="message" rows="4" required style="width: 100%; padding: 6px; border: 1px solid #ccc; font-family: inherit; box-sizing: border-box; resize: vertical;"></textarea>
    </div>
    
    <button type="submit" style="background: #3a506b; color: #fff; border: 1px solid #000; padding: 6px 15px; font-family: 'VT323', monospace; font-size: 18px; cursor: pointer;">Sign Note</button>
</form>
