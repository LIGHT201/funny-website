    <div class="container" id="cont">

    <script type="module">
        let xoff = Math.random() + 2130 * 0.5;
        let yoff = Math.random() + 130 * 0.5;
        let zoff = Math.random() + 130 * 0.5;

        import * as THREE from "three";
        import { TeapotGeometry } from "three/addons/geometries/TeapotGeometry.js";

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 12);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        camera.position.z = 5;

        const geometry = new TeapotGeometry(1, 15);
        const material = new THREE.MeshStandardMaterial({
            color: 0xa7b3d9,
            roughness: 0.3,
            metalness: 0.8
        });

        const teapot = new THREE.Mesh(geometry, material);
        teapot.position.x = 3.8;
        teapot.rotation.set(xoff, yoff, zoff);
        scene.add(teapot);

        const knotGeometry = new THREE.TorusKnotGeometry(0.7, 0.25, 100, 16);
        const knotMaterial = new THREE.MeshStandardMaterial({
            color: 0x8a2be2,
            roughness: 0.2,
            metalness: 0.9
        });

        const secondObject = new THREE.Mesh(knotGeometry, knotMaterial);
        secondObject.position.set(-4.25, 1.5, 0);
        scene.add(secondObject);

        function animate() {
            requestAnimationFrame(animate);
            teapot.rotation.y += 0.01;
            teapot.rotation.x += 0.001;
            teapot.rotation.z += 0.0021;
            secondObject.rotation.y += 0.015;
            secondObject.rotation.z += 0.01;
            secondObject.rotation.x += 0.01;
            renderer.render(scene, camera);
        }

        animate();
    </script>
